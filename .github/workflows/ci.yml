name: C++17 Core CI Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Run 49 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake g++ libpthread-stubs0-dev

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Binaries
        run: cmake --build build --config Release -j$(nproc)

      - name: Run Workbench Unit Tests
        run: ./build/workbench_tests
